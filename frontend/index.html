<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>d3plot Prototype Viewer</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    pre { background: #f6f8fa; padding: 10px; }
    .frame { margin-bottom: 12px; }
  </style>
</head>
<body>
  <h1>d3plot Prototype Viewer</h1>
  <p>Loads <code>/api/metadata</code> and lists available frames and levels. Click a level to fetch its gzipped binary and preview basic info.</p>
  <div id="content">Loading metadata...</div>
  <script>
    async function fetchMeta(){
      try{
        const r = await fetch('/api/metadata');
        if(!r.ok) throw new Error('metadata not found');
        const meta = await r.json();
        const container = document.getElementById('content');
        container.innerHTML = '';
        meta.frames.forEach(f => {
          const div = document.createElement('div');
          div.className = 'frame';
          const title = document.createElement('h3');
          title.textContent = f.source + ' (source bytes: ' + f.size + ')';
          div.appendChild(title);
          const list = document.createElement('div');
          for(const lvl of Object.keys(f.levels)){
            const info = f.levels[lvl];
            const btn = document.createElement('button');
            btn.textContent = lvl + ' (' + info.bytes + ' bytes)';
            btn.onclick = async ()=>{
              btn.disabled = true;
              btn.textContent = 'Fetching...';
              const resp = await fetch(`/api/frame?source=${encodeURIComponent(f.source)}&level=${encodeURIComponent(lvl)}`);
              if(!resp.ok){ alert('Failed: '+resp.status); btn.disabled=false; btn.textContent = lvl; return; }
              const arr = new Uint8Array(await resp.arrayBuffer());
              alert(`Fetched ${arr.length} bytes. First 32 bytes:\n` + arr.slice(0,32).join(', '));
              btn.disabled=false;
              btn.textContent = lvl + ' (' + info.bytes + ' bytes)';
            };
            list.appendChild(btn);
            list.appendChild(document.createTextNode(' '));
          }
          div.appendChild(list);
          container.appendChild(div);
        });
      }catch(e){
        document.getElementById('content').textContent = 'Error loading metadata: '+e.message;
      }
    }
    fetchMeta();
  </script>
</body>
</html>
