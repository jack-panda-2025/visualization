<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crash Simulation Viewer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      overflow: hidden;
      user-select: none;
    }

    /* ── VTK viewport fills entire window ─────────────────────────── */
    #vtk-container {
      position: absolute;
      inset: 0;
    }

    /* ── Loading screen ───────────────────────────────────────────── */
    #loading-screen {
      position: absolute;
      inset: 0;
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      gap: 18px;
    }

    #loading-screen h2 {
      font-size: 20px;
      font-weight: 400;
      color: #90caf9;
      letter-spacing: 0.05em;
    }

    #loading-message {
      font-size: 13px;
      color: #9e9e9e;
      min-height: 1.4em;
    }

    #progress-bar-outer {
      width: 320px;
      height: 6px;
      background: #2a2a4a;
      border-radius: 3px;
      overflow: hidden;
    }

    #progress-bar-inner {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #1565c0, #42a5f5);
      border-radius: 3px;
      transition: width 0.15s ease;
    }

    /* ── Top bar ──────────────────────────────────────────────────── */
    #top-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 44px;
      background: rgba(10, 10, 28, 0.82);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 16px;
      z-index: 10;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }

    #top-bar .brand {
      font-size: 14px;
      font-weight: 600;
      color: #90caf9;
      white-space: nowrap;
      letter-spacing: 0.04em;
    }

    #top-bar .divider {
      width: 1px; height: 22px;
      background: rgba(255,255,255,0.15);
      flex-shrink: 0;
    }

    #time-info {
      font-size: 13px;
      color: #b0bec5;
      white-space: nowrap;
    }

    #top-bar .spacer { flex: 1; }

    #field-select {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: #e0e0e0;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      outline: none;
    }

    #field-select:hover { background: rgba(255,255,255,0.13); }

    /* ── Energy chart panel ───────────────────────────────────────── */
    #energy-panel {
      position: absolute;
      top: 54px;
      right: 76px;
      width: 280px;
      background: rgba(10, 10, 28, 0.82);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      padding: 10px 12px 8px;
      z-index: 10;
    }

    #energy-panel .panel-title {
      font-size: 11px;
      color: #90caf9;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .legend-dot {
      display: inline-block;
      width: 20px; height: 3px;
      border-radius: 2px;
      vertical-align: middle;
    }

    #energy-canvas { display: block; }

    /* ── Colorbar ─────────────────────────────────────────────────── */
    #colorbar {
      position: absolute;
      top: 54px;
      right: 16px;
      width: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      z-index: 10;
    }

    #colorbar-gradient {
      width: 16px;
      height: 200px;
      border-radius: 3px;
      border: 1px solid rgba(255,255,255,0.15);
    }

    .colorbar-label {
      font-size: 10px;
      color: #b0bec5;
      white-space: nowrap;
      transform: rotate(0deg);
    }

    #colorbar-title {
      font-size: 10px;
      color: #90caf9;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      letter-spacing: 0.05em;
    }

    /* ── Bottom controls ──────────────────────────────────────────── */
    #bottom-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 52px;
      background: rgba(10, 10, 28, 0.82);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      z-index: 10;
      border-top: 1px solid rgba(255,255,255,0.07);
    }

    .ctrl-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: #e0e0e0;
      width: 32px; height: 28px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.1s;
    }

    .ctrl-btn:hover { background: rgba(255,255,255,0.18); }
    .ctrl-btn:active { background: rgba(255,255,255,0.25); }

    #frame-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      background: rgba(255,255,255,0.15);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    #frame-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #42a5f5;
      cursor: pointer;
      border: 2px solid #1a1a2e;
    }

    #frame-slider::-moz-range-thumb {
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #42a5f5;
      cursor: pointer;
      border: 2px solid #1a1a2e;
    }

    .ctrl-label {
      font-size: 11px;
      color: #78909c;
      white-space: nowrap;
    }

    #speed-select {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: #e0e0e0;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      outline: none;
    }

    #speed-select:hover { background: rgba(255,255,255,0.13); }
  </style>
</head>
<body>

  <!-- Loading screen -->
  <div id="loading-screen">
    <h2>Crash Simulation Viewer</h2>
    <div id="loading-message">Initializing…</div>
    <div id="progress-bar-outer">
      <div id="progress-bar-inner"></div>
    </div>
  </div>

  <!-- VTK.js WebGL canvas container -->
  <div id="vtk-container"></div>

  <!-- Top bar -->
  <div id="top-bar">
    <span class="brand">Crash Sim</span>
    <div class="divider"></div>
    <span id="time-info">t=—  f=—</span>
    <div class="spacer"></div>
    <select id="field-select">
      <option value="peeq">PEEQ</option>
      <option value="disp_mag">Displacement Mag</option>
    </select>
  </div>

  <!-- Energy chart panel -->
  <div id="energy-panel">
    <div class="panel-title">
      ENERGY
      <span><span class="legend-dot" style="background:#4fc3f7;"></span> KE</span>
      <span><span class="legend-dot" style="background:#ef5350;"></span> IE</span>
    </div>
    <canvas id="energy-canvas" width="256" height="130"></canvas>
  </div>

  <!-- Colorbar -->
  <div id="colorbar">
    <span class="colorbar-label" id="colorbar-max">1.0</span>
    <canvas id="colorbar-gradient" width="16" height="200"></canvas>
    <span class="colorbar-label" id="colorbar-min">0.0</span>
    <span id="colorbar-title" style="margin-top:6px;">PEEQ</span>
  </div>

  <!-- Bottom controls -->
  <div id="bottom-bar">
    <button class="ctrl-btn" id="btn-first" title="First frame">⏮</button>
    <button class="ctrl-btn" id="btn-play"  title="Play / Pause">▶</button>
    <button class="ctrl-btn" id="btn-last"  title="Last frame">⏭</button>
    <input  type="range" id="frame-slider" min="0" max="19" step="1" value="0" />
    <span class="ctrl-label">Speed:</span>
    <select id="speed-select">
      <option value="0.25">0.25×</option>
      <option value="0.5">0.5×</option>
      <option value="1" selected>1×</option>
      <option value="2">2×</option>
    </select>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
