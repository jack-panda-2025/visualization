<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>碰撞仿真可视化</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a14; color: #ccc; font-family: -apple-system, sans-serif; overflow: hidden; display: flex; }

#sidebar {
  width: 240px; flex-shrink: 0; height: 100vh;
  background: rgba(10,10,25,0.97); border-right: 0.5px solid rgba(255,255,255,0.1);
  display: flex; flex-direction: column; z-index: 5;
}

/* Tab 切换 */
#sidebar-tabs {
  display: flex; border-bottom: 0.5px solid rgba(255,255,255,0.1); flex-shrink: 0;
}
.tab-btn {
  flex: 1; padding: 10px 0; font-size: 11px; cursor: pointer; text-align: center;
  color: rgba(255,255,255,0.35); border: none; background: transparent;
  border-bottom: 2px solid transparent; transition: all 0.15s;
}
.tab-btn.active { color: #fff; border-bottom-color: #378ADD; }
.tab-btn:hover { color: rgba(255,255,255,0.6); }

/* 区域视图 */
#zone-view { flex: 1; overflow-y: auto; padding: 12px 10px; display: flex; flex-direction: column; gap: 8px; }
#zone-view.hidden { display: none; }

.zone-section-title {
  font-size: 10px; color: rgba(255,255,255,0.3);
  padding: 4px 4px 2px; letter-spacing: 0.5px;
}
.zone-btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.zone-btn {
  padding: 8px 6px; font-size: 11px; border-radius: 8px; cursor: pointer; text-align: center;
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.55);
  transition: all 0.15s; line-height: 1.4;
}
.zone-btn:hover { background: rgba(255,255,255,0.1); color: #fff; border-color: rgba(255,255,255,0.25); }
.zone-btn.active { background: rgba(55,138,221,0.2); color: #7bc4ff; border-color: rgba(55,138,221,0.4); }
.zone-btn .zb-icon { font-size: 16px; display: block; margin-bottom: 3px; }
.zone-btn .zb-label { display: block; }

.zone-presets { display: flex; flex-direction: column; gap: 5px; }
.preset-btn {
  padding: 7px 10px; font-size: 11px; border-radius: 7px; cursor: pointer;
  border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.5);
  text-align: left; transition: all 0.15s;
  display: flex; align-items: center; gap: 8px;
}
.preset-btn:hover { background: rgba(255,255,255,0.08); color: #fff; }
.preset-btn.active { background: rgba(55,138,221,0.15); color: #7bc4ff; border-color: rgba(55,138,221,0.3); }
.preset-btn .pb-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

.zone-divider { height: 0.5px; background: rgba(255,255,255,0.07); margin: 4px 0; }

/* Part 视图 */
#part-view { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
#part-view.hidden { display: none; }
#part-header { padding: 10px 12px 8px; border-bottom: 0.5px solid rgba(255,255,255,0.08); flex-shrink: 0; }
#search-input {
  width: 100%; height: 27px; border-radius: 6px;
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.06); color: #fff;
  font-size: 11px; padding: 0 8px; outline: none; margin-bottom: 7px;
}
#search-input:focus { border-color: rgba(255,255,255,0.3); }
#part-actions { display: flex; gap: 5px; }
.sb-btn {
  flex: 1; padding: 4px 0; font-size: 10px; border-radius: 4px; cursor: pointer;
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.45);
  transition: all 0.15s;
}
.sb-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
#part-list { flex: 1; overflow-y: auto; padding: 4px 0; }
#part-list::-webkit-scrollbar { width: 3px; }
#part-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 2px; }

.zone-group { margin-bottom: 1px; }
.zone-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 5px 12px; cursor: pointer;
  font-size: 10px; font-weight: 500; color: rgba(255,255,255,0.4);
  user-select: none;
}
.zone-header:hover { background: rgba(255,255,255,0.03); }
.zh-left { display: flex; align-items: center; gap: 5px; }
.zh-arrow { font-size: 8px; transition: transform 0.15s; display: inline-block; }
.zone-header.collapsed .zh-arrow { transform: rotate(-90deg); }
.zone-count { font-size: 10px; color: rgba(255,255,255,0.2); }
.zone-items.collapsed { display: none; }

.part-item {
  display: flex; align-items: center; gap: 7px;
  padding: 3px 12px 3px 20px; cursor: pointer; transition: background 0.1s;
}
.part-item:hover { background: rgba(255,255,255,0.04); }
.part-item.highlighted { background: rgba(55,138,221,0.1); }
.part-checkbox { width: 12px; height: 12px; flex-shrink: 0; cursor: pointer; accent-color: #378ADD; }
.part-label { font-size: 10px; color: rgba(255,255,255,0.5); flex: 1; }
.part-count { font-size: 9px; color: rgba(255,255,255,0.18); flex-shrink: 0; }
.part-item.hidden-part .part-label { color: rgba(255,255,255,0.18); text-decoration: line-through; }

/* 主视图 */
#main { flex: 1; position: relative; overflow: hidden; }
#canvas-container { width: 100%; height: 100vh; }
#ui {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 14px 18px 16px;
  background: linear-gradient(transparent, rgba(0,0,0,0.9));
  pointer-events: none;
}
#timeline-row { display: flex; align-items: center; gap: 7px; margin-bottom: 9px; pointer-events: all; }
.ctrl-btn {
  width: 30px; height: 30px; border-radius: 6px;
  border: 1px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.06);
  color: rgba(255,255,255,0.65); font-size: 13px; cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; transition: background 0.15s;
}
.ctrl-btn:hover { background: rgba(255,255,255,0.14); color: #fff; }
#btn-play {
  width: 34px; height: 34px; border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,0.28); background: rgba(255,255,255,0.08);
  color: #fff; font-size: 13px; cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
#btn-play:hover { background: rgba(255,255,255,0.16); }
#goto-wrap { display: flex; align-items: center; gap: 3px; flex-shrink: 0; }
#goto-input {
  width: 38px; height: 28px; border-radius: 5px;
  border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.06);
  color: #fff; font-size: 11px; text-align: center; outline: none;
}
.goto-label { font-size: 10px; color: rgba(255,255,255,0.3); }
#slider {
  flex: 1; -webkit-appearance: none; height: 3px; border-radius: 2px;
  background: rgba(255,255,255,0.14); outline: none; cursor: pointer;
}
#slider::-webkit-slider-thumb {
  -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%; background: #fff; cursor: pointer;
}
#time-label { font-size: 11px; color: rgba(255,255,255,0.45); min-width: 68px; text-align: right; flex-shrink: 0; }
#info-row { display: flex; align-items: center; gap: 12px; font-size: 11px; color: rgba(255,255,255,0.4); flex-wrap: wrap; }
.stat { display: flex; flex-direction: column; gap: 1px; }
.stat-val { font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.85); }
#colorbar-wrap { margin-left: auto; flex-shrink: 0; }
#colorbar-title { font-size: 9px; color: rgba(255,255,255,0.35); margin-bottom: 2px; }
#colorbar-row { display: flex; align-items: center; gap: 5px; }
.cb-label { font-size: 9px; color: rgba(255,255,255,0.3); }
#colorbar-gradient {
  width: 90px; height: 6px; border-radius: 2px;
  background: linear-gradient(to right,#0000ff,#00ffff,#00ff00,#ffff00,#ff0000);
}
/* 跟踪点视图 */
#track-view { flex: 1; overflow-y: auto; padding: 10px 8px; display: flex; flex-direction: column; gap: 6px; }
#track-view.hidden { display: none; }
#track-empty { font-size: 11px; color: rgba(255,255,255,0.2); text-align: center; padding: 24px 8px; line-height: 1.9; }
.track-item {
  border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
  padding: 9px 10px; background: rgba(255,255,255,0.03);
}
.track-item-header { display: flex; align-items: center; gap: 7px; margin-bottom: 4px; }
.track-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 5px currentColor; }
.track-label { font-size: 11px; color: rgba(255,255,255,0.7); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track-remove { font-size: 13px; color: rgba(255,255,255,0.2); cursor: pointer; padding: 0 2px; flex-shrink: 0; }
.track-remove:hover { color: #ff5555; }
.track-val { font-size: 10px; color: rgba(255,255,255,0.4); padding-left: 16px; margin-bottom: 6px; }
.track-curve-btn {
  padding: 4px 0; font-size: 10px; border-radius: 5px; cursor: pointer;
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.5);
  width: 100%; text-align: center; transition: all 0.15s;
}
.track-curve-btn:hover { background: rgba(55,138,221,0.2); color: #7bc4ff; border-color: rgba(55,138,221,0.35); }

/* Tooltip 跟踪按钮 */
#tt-track-btn {
  margin-top: 8px; padding: 5px; font-size: 10px; border-radius: 5px; cursor: pointer;
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.55);
  width: 100%; text-align: center; transition: all 0.15s; display: block;
}
#tt-track-btn:hover { background: rgba(55,138,221,0.2); color: #7bc4ff; border-color: rgba(55,138,221,0.3); }
#tt-track-btn.tracked { background: rgba(55,200,100,0.15); color: #7bffaa; border-color: rgba(55,200,100,0.3); }

/* 应力曲线弹窗 */
#chart-modal {
  position: fixed; inset: 0; background: rgba(0,0,0,0.72); z-index: 100;
  display: none; align-items: center; justify-content: center;
}
#chart-modal.visible { display: flex; }
#chart-box {
  background: #0e0e1e; border: 0.5px solid rgba(255,255,255,0.15);
  border-radius: 12px; padding: 20px 22px; width: 600px; max-width: 92vw;
}
#chart-title-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
#chart-title-text { font-size: 12px; color: rgba(255,255,255,0.65); }
#chart-close { cursor: pointer; color: rgba(255,255,255,0.3); font-size: 18px; line-height: 1; }
#chart-close:hover { color: #fff; }
#chart-canvas { width: 100%; display: block; border-radius: 4px; }

#top-bar {
  position: absolute; top: 12px; left: 12px; right: 12px;
  display: flex; align-items: center; justify-content: space-between; pointer-events: none;
}
#title { font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.65); }
#hint { font-size: 10px; color: rgba(255,255,255,0.2); text-align: right; line-height: 1.7; }
#tooltip {
  position: absolute; background: rgba(10,10,20,0.93);
  border: 0.5px solid rgba(255,255,255,0.18); border-radius: 8px;
  padding: 9px 13px; font-size: 11px; pointer-events: none;
  display: none; min-width: 175px; line-height: 1.8; z-index: 10;
}
#tooltip .tt-title { font-size: 10px; color: rgba(255,255,255,0.35); margin-bottom: 3px; }
#tooltip .tt-row { display: flex; justify-content: space-between; gap: 14px; }
#tooltip .tt-key { color: rgba(255,255,255,0.45); }
#tooltip .tt-val { color: #fff; font-weight: 500; }
#loading {
  position: absolute; inset: 0; background: #0a0a14;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; z-index: 20;
}
#loading-text { font-size: 14px; color: rgba(255,255,255,0.5); }
#progress-bar { width: 240px; height: 2px; background: rgba(255,255,255,0.1); border-radius: 1px; overflow: hidden; }
#progress-fill { height: 100%; background: #378ADD; border-radius: 1px; width: 0%; transition: width 0.25s; }
</style>
</head>
<body>

<div id="loading">
  <div id="loading-text">加载数据中...</div>
  <div id="progress-bar"><div id="progress-fill"></div></div>
</div>

<!-- 侧边栏 -->
<div id="sidebar">
  <div id="sidebar-tabs">
    <button class="tab-btn active" data-tab="zone">区域视图</button>
    <button class="tab-btn" data-tab="part">Part 视图</button>
    <button class="tab-btn" data-tab="track">跟踪点</button>
  </div>

  <!-- 区域视图 -->
  <div id="zone-view">
    <div class="zone-section-title">快速定位</div>
    <div class="zone-btn-grid">
      <button class="zone-btn" data-zone="驾驶舱">
        <span class="zb-icon">🚗</span><span class="zb-label">驾驶舱</span>
      </button>
      <button class="zone-btn" data-zone="前舱">
        <span class="zb-icon">⚙️</span><span class="zb-label">前舱</span>
      </button>
      <button class="zone-btn" data-zone="后舱">
        <span class="zb-icon">🪑</span><span class="zb-label">后舱</span>
      </button>
      <button class="zone-btn" data-zone="车尾">
        <span class="zb-icon">📦</span><span class="zb-label">车尾</span>
      </button>
      <button class="zone-btn" data-zone="护栏">
        <span class="zb-icon">🚧</span><span class="zb-label">护栏</span>
      </button>
      <button class="zone-btn" data-zone="全部">
        <span class="zb-icon">🌐</span><span class="zb-label">全部</span>
      </button>
    </div>

    <div class="zone-divider"></div>
    <div class="zone-section-title">预设组合</div>
    <div class="zone-presets">
      <button class="preset-btn" data-preset="all">
        <span class="pb-dot" style="background:#378ADD"></span>显示全部
      </button>
      <button class="preset-btn" data-preset="cabin_interior">
        <span class="pb-dot" style="background:#4CAF50"></span>仅驾驶舱内部
      </button>
      <button class="preset-btn" data-preset="no_roof">
        <span class="pb-dot" style="background:#FF9800"></span>隐藏顶棚
      </button>
      <button class="preset-btn" data-preset="no_doors">
        <span class="pb-dot" style="background:#9C27B0"></span>隐藏车门侧板
      </button>
      <button class="preset-btn" data-preset="structure_only">
        <span class="pb-dot" style="background:#F44336"></span>仅主要结构
      </button>
      <button class="preset-btn" data-preset="barrier_only">
        <span class="pb-dot" style="background:#607D8B"></span>仅护栏
      </button>
    </div>

    <div class="zone-divider"></div>
    <div class="zone-section-title">相机定位</div>
    <div class="zone-presets">
      <button class="preset-btn" id="btn-focus-driver">
        <span class="pb-dot" style="background:#FFD700"></span>主驾驶座椅（选点用）
      </button>
    </div>

    <div class="zone-divider"></div>
    <div class="zone-section-title">Z 轴高度筛选</div>
    <div class="zone-btn-grid">
      <button class="zone-btn" data-zlayer="顶部">顶部<br><small style="opacity:0.5">Z&gt;1200</small></button>
      <button class="zone-btn" data-zlayer="上部">上部<br><small style="opacity:0.5">800~1200</small></button>
      <button class="zone-btn" data-zlayer="中部">中部<br><small style="opacity:0.5">400~800</small></button>
      <button class="zone-btn" data-zlayer="底部">底部<br><small style="opacity:0.5">Z&lt;400</small></button>
    </div>
  </div>

  <!-- Part 视图 -->
  <div id="part-view" class="hidden">
    <div id="part-header">
      <input type="text" id="search-input" placeholder="搜索 part ID 或区域..."/>
      <div id="part-actions">
        <button class="sb-btn" id="btn-check-all">全部显示</button>
        <button class="sb-btn" id="btn-uncheck-all">全部隐藏</button>
      </div>
    </div>
    <div id="part-list"></div>
  </div>

  <!-- 跟踪点视图 -->
  <div id="track-view" class="hidden">
    <div id="track-empty">点击 3D 视图中的节点<br>再点击「📌 跟踪此点」<br>即可添加跟踪</div>
  </div>
</div>

<!-- 主视图 -->
<div id="main">
  <div id="canvas-container"></div>
  <div id="tooltip">
    <div class="tt-title">节点信息</div>
    <div class="tt-row"><span class="tt-key">Part ID</span><span class="tt-val" id="tt-part">—</span></div>
    <div class="tt-row"><span class="tt-key">区域</span><span class="tt-val" id="tt-zone">—</span></div>
    <div class="tt-row"><span class="tt-key">类型</span><span class="tt-val" id="tt-type">—</span></div>
    <div class="tt-row"><span class="tt-key">应变/应力</span><span class="tt-val" id="tt-val">—</span></div>
    <div class="tt-row"><span class="tt-key">位置</span><span class="tt-val" id="tt-pos">—</span></div>
    <button id="tt-track-btn">📌 跟踪此点</button>
  </div>
  <div id="top-bar">
    <div id="title">碰撞仿真 — PEEQ / Von Mises</div>
    <div id="hint">左键旋转 · 右键平移 · 滚轮缩放 · 点击节点查看</div>
  </div>
  <div id="ui">
    <div id="timeline-row">
      <button id="btn-play">▶</button>
      <button class="ctrl-btn" id="btn-prev">‹</button>
      <button class="ctrl-btn" id="btn-next">›</button>
      <div id="goto-wrap">
        <span class="goto-label">跳至</span>
        <input type="number" id="goto-input" min="1" max="55" value="1"/>
        <span class="goto-label">帧</span>
        <button class="ctrl-btn" id="btn-goto" style="width:auto;padding:0 8px;font-size:10px;">GO</button>
      </div>
      <input type="range" id="slider" min="0" max="54" value="0" step="1">
      <div id="time-label">t = 0.000 s</div>
    </div>
    <div id="info-row">
      <div class="stat"><span class="stat-val" id="stat-nodes">—</span><span>显示节点</span></div>
      <div class="stat"><span class="stat-val" id="stat-frame">0 / 0</span><span>当前帧</span></div>
      <div class="stat"><span class="stat-val" id="stat-fps">—</span><span>FPS</span></div>
      <div id="colorbar-wrap">
        <div id="colorbar-title">PEEQ / Von Mises（蓝=低，红=高）</div>
        <div id="colorbar-row">
          <span class="cb-label">0</span>
          <div id="colorbar-gradient"></div>
          <span class="cb-label" id="cb-max">—</span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 应力曲线弹窗 -->
<div id="chart-modal">
  <div id="chart-box">
    <div id="chart-title-bar">
      <span id="chart-title-text">应力/应变曲线</span>
      <span id="chart-close">✕</span>
    </div>
    <canvas id="chart-canvas" height="240"></canvas>
  </div>
</div>

function parseBin(buffer) {
  const view = new DataView(buffer);
  let off = 0;
  const magic = String.fromCharCode(view.getUint8(0),view.getUint8(1),view.getUint8(2),view.getUint8(3));
  if(magic !== 'COL2') throw new Error(`magic="${magic}"`);
  off = 4;
  const n_frames = view.getInt32(off,true); off+=4;
  const n_nodes  = view.getInt32(off,true); off+=4;
  const n_tires  = view.getInt32(off,true); off+=4;
  const eps_p95  = view.getFloat32(off,true); off+=4;
  const vm_p95   = view.getFloat32(off,true); off+=4;
  meta = { n_frames, n_nodes, n_tires, eps_p95, vm_p95 };
  timesArr = new Float32Array(n_frames);
  for(let i=0;i<n_frames;i++){timesArr[i]=view.getFloat32(off,true);off+=4;}
  posFrames=[]; valFrames=[];
  for(let f=0;f<n_frames;f++){
    const pArr=new Float32Array(n_nodes*3);
    for(let i=0;i<n_nodes*3;i++){pArr[i]=view.getFloat32(off,true);off+=4;}
    posFrames.push(pArr);
    const vArr=new Uint8Array(n_nodes);
    for(let i=0;i<n_nodes;i++){vArr[i]=view.getUint8(off);off+=1;}
    valFrames.push(vArr);
  }
  tireFrames=[];
  for(let f=0;f<n_frames;f++){
    const tArr=new Float32Array(n_tires*8);
    for(let i=0;i<n_tires*8;i++){tArr[i]=view.getFloat32(off,true);off+=4;}
    tireFrames.push(tArr);
  }
  layerArr=new Uint8Array(n_nodes);
  for(let i=0;i<n_nodes;i++){layerArr[i]=view.getUint8(off);off+=1;}
  partArr=new Int32Array(n_nodes);
  for(let i=0;i<n_nodes;i++){partArr[i]=view.getInt32(off,true);off+=4;}
}

const orb = (() => {
  const sph={theta:0.4,phi:1.1,r:5000};
  const tgt=new THREE.Vector3();
  let state='idle',px=0,py=0;
  function sync(){
    camera.position.set(
      tgt.x+sph.r*Math.sin(sph.phi)*Math.sin(sph.theta),
      tgt.y+sph.r*Math.cos(sph.phi),
      tgt.z+sph.r*Math.sin(sph.phi)*Math.cos(sph.theta));
    camera.lookAt(tgt);
  }
  renderer.domElement.addEventListener('mousedown',e=>{state=e.button===2?'pan':'rotate';px=e.clientX;py=e.clientY;});
  window.addEventListener('mouseup',()=>state='idle');
  window.addEventListener('mousemove',e=>{
    if(state==='idle')return;
    const dx=e.clientX-px,dy=e.clientY-py;px=e.clientX;py=e.clientY;
    if(state==='rotate'){sph.theta-=dx*0.005;sph.phi=Math.max(0.05,Math.min(Math.PI-0.05,sph.phi-dy*0.005));}
    else{
      const dir=new THREE.Vector3().subVectors(camera.position,tgt).normalize();
      const right=new THREE.Vector3().crossVectors(dir,camera.up).normalize();
      const up=new THREE.Vector3().crossVectors(right,dir).normalize();
      const k=sph.r*0.001;tgt.addScaledVector(right,-dx*k);tgt.addScaledVector(up,dy*k);
    }
    sync();
  });
  renderer.domElement.addEventListener('wheel',e=>{sph.r=Math.max(10,Math.min(1e6,sph.r*(1+e.deltaY*0.001)));sync();e.preventDefault();},{passive:false});
  renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());
  sync();
  return{setTarget:v=>{tgt.copy(v);sync();},setR:r=>{sph.r=r;sync();},getR:()=>sph.r};
})();

function rainbowRGB(t){
  t=Math.max(0,Math.min(1,t));let r,g,b;
  if(t<0.25){const s=t/0.25;r=0;g=s;b=1;}
  else if(t<0.5){const s=(t-0.25)/0.25;r=0;g=1;b=1-s;}
  else if(t<0.75){const s=(t-0.5)/0.25;r=s;g=1;b=0;}
  else{const s=(t-0.75)/0.25;r=1;g=1-s;b=0;}
  return[r,g,b];
}

let bodyCloud=null,posBuf=null,colBuf=null;
function buildBodyCloud(n){
  const geo=new THREE.BufferGeometry();
  posBuf=new Float32Array(n*3);colBuf=new Float32Array(n*3);
  geo.setAttribute('position',new THREE.BufferAttribute(posBuf,3));
  geo.setAttribute('color',new THREE.BufferAttribute(colBuf,3));
  bodyCloud=new THREE.Points(geo,new THREE.PointsMaterial({size:2.5,vertexColors:true,sizeAttenuation:true}));
  scene.add(bodyCloud);
}

let tireMeshes=[],tireAngle=0;
function buildTireMeshes(){
  const t0=tireFrames[0];
  for(let ti=0;ti<meta.n_tires;ti++){
    const base=ti*8,radius=t0[base+6],width=t0[base+7];
    if(radius<TIRE_OUTER_MIN_RADIUS)continue;
    const mesh=new THREE.Mesh(
      new THREE.TorusGeometry(radius,Math.max(width*0.45,20),10,36),
      new THREE.MeshBasicMaterial({color:0x2a3080,wireframe:true,transparent:true,opacity:0.9}));
    scene.add(mesh);tireMeshes.push({mesh,ti});
  }
}

function updateTireMeshes(fi){
  const t=tireFrames[fi];
  tireAngle+=(TIRE_RPM/60)*(FRAME_MS/1000)*Math.PI*2;
  for(let k=0;k<tireMeshes.length;k++){
    const{mesh,ti}=tireMeshes[k],base=ti*8;
    mesh.position.set(t[base],t[base+1],t[base+2]);
    const axis=new THREE.Vector3(t[base+3],t[base+4],t[base+5]).normalize();
    const qAlign=new THREE.Quaternion();qAlign.setFromUnitVectors(new THREE.Vector3(0,0,1),axis);
    const qSpin=new THREE.Quaternion();qSpin.setFromAxisAngle(axis,tireAngle);
    mesh.quaternion.copy(qSpin.multiply(qAlign));
  }
}

  const raw=valFrames[fi][idx],layer=layerArr[idx];
  if(raw<2)return layer===0?'0 MPa':'0';
  return layer===0?`${((raw-2)/253*meta.vm_p95).toFixed(2)} MPa`:`${((raw-2)/253*meta.eps_p95).toFixed(5)}`;
}

function updateTrackMarkers(){
  if(trackCloud){scene.remove(trackCloud);trackCloud.geometry.dispose();trackCloud=null;}
  if(!trackedPoints.length||!meta)return;
  const n=trackedPoints.length;
  const posArr=new Float32Array(n*3),colArr=new Float32Array(n*3);
  const p=posFrames[curFrame];
  trackedPoints.forEach((tp,i)=>{
    posArr[i*3]=p[tp.idx*3];posArr[i*3+1]=p[tp.idx*3+1];posArr[i*3+2]=p[tp.idx*3+2];
    const c=new THREE.Color(tp.color);
    colArr[i*3]=c.r;colArr[i*3+1]=c.g;colArr[i*3+2]=c.b;
  });
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(posArr,3));
  geo.setAttribute('color',new THREE.BufferAttribute(colArr,3));
  trackCloud=new THREE.Points(geo,new THREE.PointsMaterial({size:14,vertexColors:true,sizeAttenuation:true,depthTest:false}));
  scene.add(trackCloud);
}

function updateTrackPanel(){
  const view=document.getElementById('track-view');
  view.querySelectorAll('.track-item').forEach(el=>el.remove());
  const empty=document.getElementById('track-empty');
  if(!trackedPoints.length){empty.style.display='block';return;}
  empty.style.display='none';
  trackedPoints.forEach((tp,i)=>{
    const valStr=meta?nodeStressStr(tp.idx,curFrame):'—';
    const item=document.createElement('div');item.className='track-item';
    item.innerHTML=`
      <div class="track-item-header">
        <div class="track-dot" style="background:${tp.color};color:${tp.color}"></div>
        <div class="track-label" title="${tp.label}">${tp.label}</div>
        <span class="track-remove" data-i="${i}">✕</span>
      </div>
      <div class="track-val" id="tval-${i}">${valStr}</div>
      <button class="track-curve-btn" data-i="${i}">📈 查看应力曲线</button>`;
    item.querySelector('.track-remove').addEventListener('click',()=>{
      trackedPoints.splice(i,1);updateTrackPanel();updateTrackMarkers();
    });
    item.querySelector('.track-curve-btn').addEventListener('click',()=>showStressCurve(tp));
    view.appendChild(item);
  });
}

function addTrackedPoint(idx){
  if(trackedPoints.some(tp=>tp.idx===idx))return;
  const color=TRACK_COLORS[trackedPoints.length%TRACK_COLORS.length];
  const pid=partArr[idx],zone=partZoneMap[pid]||'未知';
  trackedPoints.push({idx,label:zone,color});
  updateTrackPanel();updateTrackMarkers();
  document.querySelector('.tab-btn[data-tab="track"]').click();
}

// ---- 应力曲线 ----
let chartTarget=null;
function showStressCurve(tp){
  chartTarget=tp;
  document.getElementById('chart-title-text').textContent=`应力/应变曲线 — ${tp.label}`;
  document.getElementById('chart-modal').classList.add('visible');
  requestAnimationFrame(()=>drawStressCurve(document.getElementById('chart-canvas'),tp));
}
function drawStressCurve(canvas,tp){
  const dpr=window.devicePixelRatio||1;
  const cw=canvas.clientWidth;
  const ch=parseInt(canvas.getAttribute('height'));
  canvas.width=cw*dpr;canvas.height=ch*dpr;
  const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
  const w=cw,h=ch;
  const layer=layerArr[tp.idx],isVM=layer===0;
  const n=meta.n_frames;
  const vals=[];let maxV=0;
  for(let fi=0;fi<n;fi++){
    const raw=valFrames[fi][tp.idx];
    const v=raw<2?0:(isVM?(raw-2)/253*meta.vm_p95:(raw-2)/253*meta.eps_p95);
    vals.push(v);if(v>maxV)maxV=v;
  }
  if(maxV===0)maxV=1;
  const pad={t:18,r:20,b:32,l:58};
  const pw=w-pad.l-pad.r,ph=h-pad.t-pad.b;
  ctx.fillStyle='#080814';ctx.fillRect(0,0,w,h);
  // grid
  for(let gi=0;gi<=5;gi++){
    const gy=pad.t+ph*(1-gi/5);
    ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=0.5;
    ctx.beginPath();ctx.moveTo(pad.l,gy);ctx.lineTo(pad.l+pw,gy);ctx.stroke();
    const gv=maxV*gi/5;
    ctx.fillStyle='rgba(255,255,255,0.28)';ctx.font=`9px -apple-system,sans-serif`;ctx.textAlign='right';
    ctx.fillText(isVM?gv.toFixed(0):gv.toFixed(4),pad.l-5,gy+3);
  }
  // x ticks
  const tickStep=Math.max(1,Math.ceil(n/8));
  for(let fi=0;fi<n;fi+=tickStep){
    const gx=pad.l+pw*fi/Math.max(1,n-1);
    ctx.strokeStyle='rgba(255,255,255,0.05)';ctx.lineWidth=0.5;
    ctx.beginPath();ctx.moveTo(gx,pad.t);ctx.lineTo(gx,pad.t+ph);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.28)';ctx.font='9px -apple-system,sans-serif';ctx.textAlign='center';
    ctx.fillText(fi+1,gx,h-pad.b+13);
  }
  // axis labels
  ctx.save();ctx.translate(11,pad.t+ph/2);ctx.rotate(-Math.PI/2);
  ctx.fillStyle='rgba(255,255,255,0.38)';ctx.font='9px -apple-system,sans-serif';ctx.textAlign='center';
  ctx.fillText(isVM?'Von Mises (MPa)':'PEEQ',0,0);ctx.restore();
  ctx.fillStyle='rgba(255,255,255,0.38)';ctx.font='9px -apple-system,sans-serif';ctx.textAlign='center';
  ctx.fillText('帧',pad.l+pw/2,h-2);
  // area fill
  ctx.beginPath();
  for(let fi=0;fi<n;fi++){
    const gx=pad.l+pw*fi/Math.max(1,n-1),gy=pad.t+ph*(1-vals[fi]/maxV);
    fi===0?ctx.moveTo(gx,gy):ctx.lineTo(gx,gy);
  }
  ctx.lineTo(pad.l+pw,pad.t+ph);ctx.lineTo(pad.l,pad.t+ph);ctx.closePath();
  ctx.fillStyle='rgba(55,138,221,0.12)';ctx.fill();
  // line
  ctx.beginPath();ctx.strokeStyle=tp.color;ctx.lineWidth=1.8;
  for(let fi=0;fi<n;fi++){
    const gx=pad.l+pw*fi/Math.max(1,n-1),gy=pad.t+ph*(1-vals[fi]/maxV);
    fi===0?ctx.moveTo(gx,gy):ctx.lineTo(gx,gy);
  }
  ctx.stroke();
  // current frame marker
  const cfx=pad.l+pw*curFrame/Math.max(1,n-1);
  ctx.strokeStyle='rgba(255,255,255,0.45)';ctx.lineWidth=1;ctx.setLineDash([4,3]);
  ctx.beginPath();ctx.moveTo(cfx,pad.t);ctx.lineTo(cfx,pad.t+ph);ctx.stroke();ctx.setLineDash([]);
  const cfy=pad.t+ph*(1-vals[curFrame]/maxV);
  ctx.beginPath();ctx.arc(cfx,cfy,4,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
  // current val label
  ctx.fillStyle='rgba(255,255,255,0.6)';ctx.font='9px -apple-system,sans-serif';ctx.textAlign='center';
  ctx.fillText(`帧${curFrame+1}: ${isVM?vals[curFrame].toFixed(2)+'MPa':vals[curFrame].toFixed(5)}`,cfx,cfy-9);
}
document.getElementById('chart-close').addEventListener('click',()=>document.getElementById('chart-modal').classList.remove('visible'));
document.getElementById('chart-modal').addEventListener('click',e=>{if(e.target===document.getElementById('chart-modal'))document.getElementById('chart-modal').classList.remove('visible');});

function applyFrame(fi){
  if(!bodyCloud)return;
  curFrame=fi;
  const{n_nodes}=meta,pos=posFrames[fi],val=valFrames[fi];
  let visible=0;
  for(let i=0;i<n_nodes;i++){
    const pid=partArr[i];
    const hide=hiddenParts.has(pid);
    const i3=i*3;
    posBuf[i3]=pos[i3];posBuf[i3+1]=pos[i3+1];posBuf[i3+2]=pos[i3+2];
    if(hide){colBuf[i3]=0;colBuf[i3+1]=0;colBuf[i3+2]=0;}
    else{
      visible++;
      const v=val[i];
      if(v<2){colBuf[i3]=0.12;colBuf[i3+1]=0.14;colBuf[i3+2]=0.35;}
      else{const[r,g,b]=rainbowRGB((v-2)/253);colBuf[i3]=r;colBuf[i3+1]=g;colBuf[i3+2]=b;}
    }
  }
  bodyCloud.geometry.attributes.position.needsUpdate=true;
  bodyCloud.geometry.attributes.color.needsUpdate=true;
  updateTireMeshes(fi);
  document.getElementById('slider').value=fi;
  document.getElementById('goto-input').value=fi+1;
  document.getElementById('time-label').textContent=`t = ${timesArr[fi].toFixed(3)} s`;
  document.getElementById('stat-frame').textContent=`${fi+1} / ${meta.n_frames}`;
  document.getElementById('stat-nodes').textContent=visible.toLocaleString();
  if(trackedPoints.length){updateTrackMarkers();updateTrackPanel();}
  if(chartTarget&&document.getElementById('chart-modal').classList.contains('visible')){
    drawStressCurve(document.getElementById('chart-canvas'),chartTarget);
  }
}

// ---- Part 视图 ----
function buildPartList(filter=''){
  const listEl=document.getElementById('part-list');
  listEl.innerHTML='';
  const groups={};
  PARTS_DATA.forEach(p=>{
    if(filter){
      const q=filter.toLowerCase();
      if(!String(p.id).includes(q)&&!p.zone.includes(filter))return;
    }
    if(!groups[p.zone])groups[p.zone]=[];
    groups[p.zone].push(p);
  });
  const zoneOrder=['驾驶舱','前舱','后舱','车尾','车头','护栏'];
  const allZones=[...new Set([...zoneOrder.filter(z=>groups[z]),...Object.keys(groups).filter(z=>!zoneOrder.includes(z))])];
  allZones.forEach(zone=>{
    const parts=groups[zone];if(!parts||!parts.length)return;
    const groupEl=document.createElement('div');groupEl.className='zone-group';
    const headerEl=document.createElement('div');headerEl.className='zone-header';
    const isCollapsed=zone!=='驾驶舱';
    if(isCollapsed)headerEl.classList.add('collapsed');
    headerEl.innerHTML=`<div class="zh-left"><span class="zh-arrow">▾</span><span>${zone}</span></div><span class="zone-count">${parts.length}</span>`;
    const itemsEl=document.createElement('div');itemsEl.className='zone-items';
    if(isCollapsed)itemsEl.classList.add('collapsed');
    headerEl.addEventListener('click',()=>{headerEl.classList.toggle('collapsed');itemsEl.classList.toggle('collapsed');});
    parts.forEach(p=>{
      const itemEl=document.createElement('div');itemEl.className='part-item';itemEl.dataset.pid=p.id;
      if(hiddenParts.has(p.id))itemEl.classList.add('hidden-part');
      const cb=document.createElement('input');cb.type='checkbox';cb.className='part-checkbox';cb.checked=!hiddenParts.has(p.id);
      cb.addEventListener('change',()=>{
        if(cb.checked)hiddenParts.delete(p.id);else hiddenParts.add(p.id);
        itemEl.classList.toggle('hidden-part',!cb.checked);applyFrame(curFrame);
      });
      const labelEl=document.createElement('div');labelEl.className='part-label';
      labelEl.textContent=p.id;
      const countEl=document.createElement('div');countEl.className='part-count';
      countEl.textContent=p.count>999?Math.round(p.count/1000)+'k':p.count;
      itemEl.appendChild(cb);itemEl.appendChild(labelEl);itemEl.appendChild(countEl);
      itemsEl.appendChild(itemEl);
    });
    groupEl.appendChild(headerEl);groupEl.appendChild(itemsEl);listEl.appendChild(groupEl);
  });
}

function syncCheckboxes(){
  document.querySelectorAll('.part-item').forEach(el=>{
    const pid=parseInt(el.dataset.pid);
    const cb=el.querySelector('.part-checkbox');
    if(cb){cb.checked=!hiddenParts.has(pid);el.classList.toggle('hidden-part',!cb.checked);}
  });
}

document.getElementById('search-input').addEventListener('input',function(){buildPartList(this.value.trim());});
document.getElementById('btn-check-all').addEventListener('click',()=>{hiddenParts.clear();syncCheckboxes();applyFrame(curFrame);});
document.getElementById('btn-uncheck-all').addEventListener('click',()=>{PARTS_DATA.forEach(p=>hiddenParts.add(p.id));syncCheckboxes();applyFrame(curFrame);});

// ---- 点击检测 ----
const raycaster=new THREE.Raycaster();
const mouse=new THREE.Vector2();
const tooltip=document.getElementById('tooltip');
let isDragging=false,mouseDownPos={x:0,y:0};
renderer.domElement.addEventListener('mousedown',e=>{mouseDownPos={x:e.clientX,y:e.clientY};isDragging=false;tooltip.style.display='none';});
renderer.domElement.addEventListener('mousemove',e=>{const dx=e.clientX-mouseDownPos.x,dy=e.clientY-mouseDownPos.y;if(Math.sqrt(dx*dx+dy*dy)>4)isDragging=true;});
renderer.domElement.addEventListener('click',e=>{
  if(isDragging||!bodyCloud)return;
  const rect=renderer.domElement.getBoundingClientRect();
  mouse.x=((e.clientX-rect.left)/rect.width)*2-1;
  mouse.y=-((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(mouse,camera);
  // 动态阈值：缩小时选点更精准
  raycaster.params.Points.threshold=Math.max(3,orb.getR()*0.006);
  const objs=[bodyCloud];if(trackCloud)objs.push(trackCloud);
  const hits=raycaster.intersectObjects(objs);
  if(!hits.length){tooltip.style.display='none';return;}
  // 优先命中主点云
  const hit=hits.find(h=>h.object===bodyCloud)||hits[0];
  const idx=hit.index,val=valFrames[curFrame][idx],layer=layerArr[idx],pid=partArr[idx],pos=posFrames[curFrame];
  lastClickedIdx=idx;
  const zone=partZoneMap[pid]||'未知';
  let valStr,typeStr;
  if(layer===0){typeStr='护栏（Von Mises）';valStr=val<2?'0 MPa':`${((val-2)/253*meta.vm_p95).toFixed(2)} MPa`;}
  else{typeStr='车身（PEEQ）';valStr=val<2?'0':`${((val-2)/253*meta.eps_p95).toFixed(5)}`;}
  document.getElementById('tt-part').textContent=pid;
  document.getElementById('tt-zone').textContent=zone;
  document.getElementById('tt-type').textContent=typeStr;
  document.getElementById('tt-val').textContent=valStr;
  document.getElementById('tt-pos').textContent=`${pos[idx*3].toFixed(0)}, ${pos[idx*3+1].toFixed(0)}, ${pos[idx*3+2].toFixed(0)}`;
  const isTracked=trackedPoints.some(tp=>tp.idx===idx);
  const trackBtn=document.getElementById('tt-track-btn');
  trackBtn.classList.toggle('tracked',isTracked);
  trackBtn.textContent=isTracked?'✓ 已跟踪':'📌 跟踪此点';
  document.querySelectorAll('.part-item.highlighted').forEach(el=>el.classList.remove('highlighted'));
  const itemEl=document.querySelector(`.part-item[data-pid="${pid}"]`);
  if(itemEl){itemEl.classList.add('highlighted');itemEl.scrollIntoView({block:'nearest'});}
  const tx=Math.min(e.clientX-rect.left+16,rect.width-200);
  const ty=Math.min(e.clientY-rect.top-10,rect.height-160);
  tooltip.style.left=tx+'px';tooltip.style.top=ty+'px';tooltip.style.display='block';
});
document.getElementById('tt-track-btn').addEventListener('click',()=>{
  if(lastClickedIdx<0)return;
  const existing=trackedPoints.findIndex(tp=>tp.idx===lastClickedIdx);
  if(existing>=0){
    trackedPoints.splice(existing,1);
    document.getElementById('tt-track-btn').classList.remove('tracked');
    document.getElementById('tt-track-btn').textContent='📌 跟踪此点';
    updateTrackPanel();updateTrackMarkers();
  } else {
    addTrackedPoint(lastClickedIdx);
    document.getElementById('tt-track-btn').classList.add('tracked');
    document.getElementById('tt-track-btn').textContent='✓ 已跟踪';
  }
});

// 帧控制
document.getElementById('btn-prev').addEventListener('click',()=>{if(meta)applyFrame(Math.max(0,curFrame-1));});
document.getElementById('btn-next').addEventListener('click',()=>{if(meta)applyFrame(Math.min(meta.n_frames-1,curFrame+1));});
document.getElementById('btn-goto').addEventListener('click',()=>{

});
document.getElementById('goto-input').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('btn-goto').click();});
window.addEventListener('keydown',e=>{
  if(!meta||e.target.tagName==='INPUT')return;
  if(e.key==='ArrowLeft')applyFrame(Math.max(0,curFrame-1));
  if(e.key==='ArrowRight')applyFrame(Math.min(meta.n_frames-1,curFrame+1));
});

// 加载
async function load(){
  const prog=document.getElementById('progress-fill'),txt=document.getElementById('loading-text');
  try{
    txt.textContent='下载数据...';prog.style.width='10%';
    const resp=await fetch(DATA_URL);if(!resp.ok)throw new Error(`HTTP ${resp.status}`);
    const total=parseInt(resp.headers.get('content-length')||'0');
    const reader=resp.body.getReader();const chunks=[];let received=0;
    while(true){const{done,value}=await reader.read();if(done)break;chunks.push(value);received+=value.length;if(total)prog.style.width=(10+65*received/total).toFixed(0)+'%';}
    prog.style.width='78%';txt.textContent='解析数据...';
    const merged=new Uint8Array(received);let o=0;for(const c of chunks){merged.set(c,o);o+=c.length;}
    parseBin(merged.buffer);
    document.getElementById('cb-max').textContent=`${meta.eps_p95.toFixed(4)}/${meta.vm_p95.toFixed(0)}MPa`;
    document.getElementById('goto-input').max=meta.n_frames;
    prog.style.width='90%';txt.textContent='构建场景...';
    buildBodyCloud(meta.n_nodes);buildTireMeshes();
    const p0=posFrames[0],step=Math.max(1,Math.floor(meta.n_nodes/2000));
    let cx=0,cy=0,cz=0,cnt=0,maxD=0;
    for(let i=0;i<meta.n_nodes;i+=step){cx+=p0[i*3];cy+=p0[i*3+1];cz+=p0[i*3+2];cnt++;}
    cx/=cnt;cy/=cnt;cz/=cnt;
    for(let i=0;i<meta.n_nodes;i+=step){const dx=p0[i*3]-cx,dy=p0[i*3+1]-cy,dz=p0[i*3+2]-cz;maxD=Math.max(maxD,Math.sqrt(dx*dx+dy*dy+dz*dz));}
    orb.setTarget(new THREE.Vector3(cx,cy,cz));orb.setR(maxD*2.2);
    document.getElementById('slider').max=meta.n_frames-1;
    buildPartList();
    applyFrame(0);
    prog.style.width='100%';
    setTimeout(()=>document.getElementById('loading').style.display='none',250);
  }catch(err){txt.textContent=`加载失败：${err.message}`;txt.style.color='#e53935';console.error(err);}
}

let playing=false,lastT=0;
const fps={n:0,last:performance.now()};
document.getElementById('btn-play').addEventListener('click',()=>{
  playing=!playing;document.getElementById('btn-play').textContent=playing?'⏸':'▶';
  if(playing)lastT=performance.now();
});

function loop(now){
  requestAnimationFrame(loop);fps.n++;
  if(now-fps.last>600){document.getElementById('stat-fps').textContent=Math.round(fps.n/((now-fps.last)/1000));fps.n=0;fps.last=now;}
  if(playing&&meta&&now-lastT>=FRAME_MS){applyFrame((curFrame+1)%meta.n_frames);lastT=now;}
  renderer.render(scene,camera);
}

load();requestAnimationFrame(loop);
